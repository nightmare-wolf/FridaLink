[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fridalink-sidecar"
version = "0.1.0"
description = "FridaLink Python 3 sidecar for Burp + Frida runtime telemetry"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13.1,<16",
]

[project.optional-dependencies]
frida = [
  "frida>=16.0.0",
]

[project.scripts]
fridalink-sidecar = "fridalink_sidecar.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
